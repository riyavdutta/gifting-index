# Fetches fresh data every morning and commits it, which makes Vercel redeploy the site.
# Needs one repository secret: SERPAPI_KEY (Settings → Secrets and variables → Actions).
name: Refresh data

on:
  schedule:
    - cron: '20 6 * * *'     # 06:20 UTC daily
  workflow_dispatch: {}       # "Run workflow" button on the Actions tab
  push:                       # also runs when the fetcher itself changes (not on its own data commits)
    branches: [main]
    paths:
      - '.github/workflows/data.yml'
      - 'scripts/fetch_data.py'

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Google Trends and Wikipedia
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python3 scripts/fetch_data.py
      - name: Commit if anything changed
        run: |
          git config user.name "gifting-index-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Refresh data $(date -u +%Y-%m-%d)"
            git push
          fi
